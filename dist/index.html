  <body>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        if (window.__LECTUREPALS__) return;
        var root = document.getElementById("root");
        if (!root || root.childElementCount) return;
        root.innerHTML =
          '<main class="boot-help">' +
          "<p>LecturePals did not start.</p>" +
          "<h1>This address only served the empty page.</h1>" +
          "<p>Port 5500 is Live Server. It cannot compile this React app, so the page stays blank.</p>" +
          "<ol><li>Click Go Live again to stop it.</li><li>In the project folder, run <code>npm install</code> and then <code>npm run dev</code>.</li><li>Open the address Vite prints, usually <a href='http://127.0.0.1:5173'>http://127.0.0.1:5173</a>.</li></ol>" +
          "<p>To keep using Go Live, run <code>npm run build</code> first, then start Go Live again. It will open the built site.</p>" +
          "</main>";
      }, 1200);
    </script>
  </body>
